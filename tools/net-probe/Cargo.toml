[package]
name = "pastey-net-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Isolated cross-NAT connectivity probe for Pastey research. Not part of the Pastey app build or bundle."

[[bin]]
name = "net-probe"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
blake3 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
iroh = "~1.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
iroh = { version = "~1.3", features = ["test-utils"] }

# Standalone: never a member of the Pastey workspace or bundle.
[workspace]
