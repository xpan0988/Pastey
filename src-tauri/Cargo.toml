[package]
name = "pastey"
version = "1.9.2"
description = "Local-first encrypted paste and file transfer utility"
authors = ["xpan0988"]
edition = "2021"
default-run = "pastey"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.7", features = ["json"] }
anyhow = "1"
base64 = "0.22"
blake3 = "1.5"
chacha20poly1305 = { version = "0.10", features = ["std"] }
dirs = "6"
futures-util = "0.3"
hex = "0.4"
hkdf = "0.12"
http = "1"
libc = "0.2"
mime_guess = "2.0"
parking_lot = "0.12"
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sanitize-filename = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"
uuid = { version = "1", features = ["serde", "v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev-fast]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = false
overflow-checks = false
incremental = true
codegen-units = 16

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
